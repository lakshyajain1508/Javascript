<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop</title>
    <script>

        let count = 5;
        while (count >= 1) {
            console.log(count);
            count--;
        }

        let sum = 0;
        let number = 1;
        while (number <= 10) {
            sum += number;
            number++;
        }
        console.log("The sum is: " + sum);

    </script>
</head>
