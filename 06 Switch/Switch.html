<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
    <script>

        const number = parseInt(prompt('Enter a number between 1 to 7 to see the days: '));

        switch (number) {
            case 1:
                document.write("Sunday").innerHTMl;
                break;
            case 2:
                document.write("Monday").innerHTMl;
                break;
            case 3:
                document.write("Tuesday").innerHTMl;
                break;
            case 4:
                cdocument.write("Wednesday").innerHTMl;
                break;
            case 5:
                document.write("Thursday").innerHTMl;
                break;
            case 6:
                document.write("Friday").innerHTMl;
                break;
            case 7:
                document.write("Saturday").innerHTMl;
                break;
            default:
                console.log("Invalid Number");
        }

    </script>
</head>

</html>
