<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects</title>
    <script>
        // Object Literal

        const colors = {

            color1: "Red",
            color2: "Orange"

        }
        // How to print output using Object Constructor
        console.log("---------Colors--------");
        console.log("Colors :",colors);
        console.log("-------Individual--------");
        console.log("Color 1 : ",colors.color1);
        console.log("Color 2 : ",colors.color2);


        class info{ // Create a class

            print_info(){ // Create a method

                console.log("Name : Lakshya Jain");
                console.log("Account No : 34420100004123")
                console.log("Balance : $501")


            }

        }

        obj = new info  // Creating a object to call function
        obj.print_info()
    </script>
</head>
<body>
    
</body>
</html>
