<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion</title>
    <script>

        // 1. String to Number: To convert a string to a number, you can use parseInt() or parseFloat() functions, or simply use the unary plus operator (+).

        let numericString = "42";
        let number = parseInt(numericString); // Using parseInt
        let floatNumber = parseFloat("3.14");  // Using parseFloat
        let number2 = +numericString;          // Using the unary plus operator

        console.log(number); // 42 (as a number)
        console.log(floatNumber); // 3.14 (as a float)

        // 2. Number to String: To convert a number to a string, you can use the String() function or concatenate the number with an empty string.

        let num = 42;
        let numAsString = String(num); // Using String function
        let numAsString2 = num + "";   // Concatenating with an empty string

        console.log(numAsString); // "42" (as a string)

        // 3. Boolean to Number: A boolean true can be converted to 1, and false can be converted to 0.

        let trueBoolean = true;
        let falseBoolean = false;
        let trueNumber = Number(trueBoolean);
        let falseNumber = Number(falseBoolean);

        console.log(trueNumber); // 1
        console.log(falseNumber); // 0

        // 4. Number to Boolean: Any non-zero number is considered true, while 0 is considered false.

        let num1 = 42;
        let num2 = 0;
        let bool1 = Boolean(num1); // true
        let bool2 = Boolean(num2); // false

        console.log(bool1); // true
        console.log(bool2); // false

        // 5. Other Type Conversions: JavaScript also performs automatic type conversions in various situations, such as when using operators. For example, when you concatenate a string and a number, JavaScript will automatically convert the number to a string.

        let number3 = 42;
        let str = "The answer is: " + number3; // Automatic conversion of 'num' to a string
        console.log(str); // "The answer is: 42"


    </script>
</head>

<body>

</body>

</html>
