<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt</title>
  <style>
    .hn {
      text-decoration: dotted;
      color: red;
      font-size: 20px;
    }
  </style>
  <script>
    mango = prompt("enter the fruit name 1= ");
    apple = prompt("enter the fruit name 2=");
    banana = prompt("enter the fruit name 3=");
    orange = prompt("enter the fruit name 4=");
    let fruits = [mango, apple, banana, orange];
    document.write("Fruits List : - ");

    for (let index = 0; index < fruits.length; index++) {
      let element = fruits[index];

      document.write("<li class='hn'>" + element + "</li>");
    }
  </script>
</head>

<body>

</body>

</html>
