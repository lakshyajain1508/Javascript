<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Scope</title>
    <script>

        // local scope: Variables declared within a function are said to have local scope. These variables are accessible only within the function where they are defined.

        function info(){
            var num = 5;
            console.log(num);
        }
        
        info()

    </script>
</head>
