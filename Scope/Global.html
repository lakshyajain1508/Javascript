<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Scope</title>
    <script>
        // global scope : Variables declared outside of any function or block have global scope. They are accessible from anywhere in the script.
        
        num = 10
        function info(){
            console.log(num)
        }

        info()
    </script>
</head>

</body>
</html>
