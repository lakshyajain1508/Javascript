<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <script>

    function data() {
      course = ["python", "java", "c++"]

      for (a = 0; a < course.length; a++) {
        document.getElementById("item").innerHTML += "<li>" + course[a] + "</li>";
      }
    }

  </script>
  <style>
    li {
      color: rgb(0, 0, 0);
    }

    ul {
      list-style-type: none;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container p-5">
    <div class="row justify-content-sm-center">
      <div class="col-sm-4">
        <div class="p-3">
          <div class="card-header justify-content-center align-content-center text-center">
            <img src="img/image copy.png" width="200px" height="200px" alt="..." />
          </div>
          <div class="text-center align-content-center">
            <h5 class="text-black mt-2 text-center">Courses</h5>
            <p class="card-text">
            <ul id="item"></ul>
            </p>
          </div>
          <p class="card-text text-center">
          <button class="btn btn-warning p-1 w-50 text-center" onclick="data()">View Courses</button>
          </p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
