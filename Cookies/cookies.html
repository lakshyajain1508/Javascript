<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>


<script>


    function send_cookies(){

        Name = document.getElementById("name").value;
        Value = document.getElementById("value").value;

        document.cookie = Name+" = "+Value;

    }

    function Show_cookies(){
        document.getElementById("print_cooki").innerHTML = document.cookie;
    }


</script>


</head>
<body class="bg-black">
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-sm-6 border border-warning">

                <div class="m-3">
                    <label class="form-label text-warning">Cookies Name</label>
                    <input type="text" id="name" class="form-control">

                    <label class="form-label text-warning mt-2">Value</label>
                    <input type="text" id="value" class="form-control">

                    <div class="btn btn-danger mt-3" onclick="send_cookies()">Send Cookies</div>
                </div>
                
            </div>
        </div>
    </div>

    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-sm-6 border border-warning">
                <div class="m-3">
                    <div class="btn btn-danger mt-3" onclick="Show_cookies()">Show Cookies</div>
                    <div class="alert alert-danger form-control mt-3" role="alert">
                            <p class="text-dark" id="print_cooki"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
